[package]
name = "trainer-client"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "trainer_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-zustand = "1.2.1"
tauri-plugin-system-audio = "0.1.1"
base64 = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "sync"] }
rodio = { version = "0.22.2", default-features = false, features = ["playback"] }
# WS-клиент в Rust не подпадает под App Transport Security, который блокирует
# ws:// на внешний хост внутри webview. rustls — под будущий wss:// за прокси.
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
incremental = false
debug = false
debug-assertions = false
overflow-checks = false
panic = "abort"
strip = "symbols"
