worker_processes auto;
user nginx;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';
  access_log /dev/stdout main;

  # Сжатие статики. Сборка клиента — около 5 МБ текста на первую загрузку:
  # без сжатия страница успевает отрисоваться раньше, чем приходит CSS, и
  # выглядит сломанной, пока пользователь не обновит вкладку.
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_proxied any;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/manifest+json
    application/wasm
    image/svg+xml;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  upstream system112_backend {
    server backend:3000;
    keepalive 32;
  }

  upstream system112_asterisk {
    server asterisk:8088;
  }

  server {
    listen 8443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/tls/tls.crt;
    ssl_certificate_key /etc/nginx/tls/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    client_max_body_size 12m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location = /gateway-health {
      access_log off;
      add_header Content-Type text/plain;
      return 200 "ok\n";
    }

    location /api/ {
      proxy_pass http://system112_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_connect_timeout 5s;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_buffering off;
    }

    # SIP.js uses the same trusted HTTPS origin as the application. TLS ends
    # here; Asterisk's built-in HTTP server stays private in the Compose
    # network and receives the upgraded WebSocket on its canonical /ws path.
    location = /asterisk/ws {
      proxy_pass http://system112_asterisk/ws;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_connect_timeout 5s;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_buffering off;
    }

    # Карта: стили, шрифты и тайлы отдаёт TileServer во внутренней сети.
    # Через gateway они приходят с того же origin, что и страница, поэтому
    # браузер не блокирует их как смешанное содержимое.
    location /maps/ {
      proxy_pass http://tileserver:8080/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
      # Тайлы меняются только при обновлении архива.
      expires 7d;
      add_header Cache-Control "public, max-age=604800" always;
    }

    # Файлы сборки названы по содержимому, поэтому их можно кешировать надолго.
    location /assets/ {
      root /usr/share/nginx/html;
      expires 1y;
      add_header Cache-Control "public, immutable" always;
      try_files $uri =404;
    }

    location / {
      root /usr/share/nginx/html;
      # index.html перечисляет файлы сборки поимённо: закешированная страница
      # после выкатки ссылается на уже удалённые файлы, и разделы перестают
      # открываться. Поэтому её всегда перепроверяют на сервере.
      add_header Cache-Control "no-store" always;
      try_files $uri $uri/ /index.html;
    }
  }
}
