; Рабочие места ДДС регистрируются как SIP-абоненты: аппаратный телефон
; вроде РТУ Т16Р или софтфон. Номера нарядов не регистрируются — их обслуживает
; приложение crew-handoff, поэтому здесь описаны только абоненты ДДС.

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060
@EXTERNAL_ADDRESSES@

[transport-tcp]
type = transport
protocol = tcp
bind = 0.0.0.0:5060
@EXTERNAL_ADDRESSES@

; Browser softphones use SIP over WebSocket. In production TLS terminates at
; the trusted reverse proxy and only /ws is forwarded to Asterisk.
[transport-ws]
type = transport
protocol = ws
bind = 0.0.0.0
@EXTERNAL_ADDRESSES@

[dds-endpoint](!)
type = endpoint
context = dds-workstations
disallow = all
; G.722 — широкополосный кодек, который есть и у РТУ Т16Р, и в Asterisk без
; внешних модулей. G.711 остаётся для софтфонов попроще.
allow = g722,alaw,ulaw
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes
dtmf_mode = rfc4733

[dds-webrtc-endpoint](!)
type = endpoint
transport = transport-ws
context = dds-workstations
disallow = all
allow = opus,ulaw,alaw
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes
dtmf_mode = rfc4733
; Expands to AVPF, DTLS-SRTP, fingerprint verification, ICE and RTCP mux.
webrtc = yes
dtls_auto_generate_cert = yes

[dds-auth](!)
type = auth
auth_type = userpass

[dds-aor](!)
type = aor
max_contacts = 1
remove_existing = yes

@WORKSTATIONS@
