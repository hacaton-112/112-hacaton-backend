[general]
static = yes
writeprotect = yes

; Любой набранный с рабочего места ДДС номер уходит в приложение: оно само
; решает, есть ли такой наряд, и записывает даже ошибочный набор — правильность
; номера входит в оценку.
[dds-workstations]
exten => _X.,1,NoOp(DDS ${CALLERID(num)} calls ${EXTEN})
 same => n,Stasis(@ARI_APP@,${EXTEN})
 same => n,Hangup()
