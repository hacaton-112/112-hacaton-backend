# Разработка: backend запущен на хосте (bun run start:dev), в Docker — только
# зависимости и мониторинг. Включается через PROMETHEUS_CONFIG=prometheus.host.yml.
global:
  scrape_interval: 10s
  scrape_timeout: 5s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: system112-backend
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:9464

  # ASR также запущен на хосте и отдаёт метрики на основном HTTP-порту.
  - job_name: system112-asr
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:8787
