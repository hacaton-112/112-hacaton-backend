# Стек целиком в compose: backend запущен из профиля app.
global:
  scrape_interval: 10s
  scrape_timeout: 5s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # Метрики backend живут на отдельном внутреннем порту, а не рядом с API.
  - job_name: system112-backend
    metrics_path: /metrics
    static_configs:
      - targets:
          - backend:9464

  # ASR поднят на том же хосте отдельным compose-проектом.
  - job_name: system112-asr
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:8787
