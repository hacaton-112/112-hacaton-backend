global:
  scrape_interval: 10s
  scrape_timeout: 5s
  evaluation_interval: 10s

scrape_configs:
  - job_name: system112-backend
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:3000

  - job_name: system112-asr
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:8787
