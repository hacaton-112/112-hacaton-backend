apiVersion: 1

datasources:
  # uid закреплён: дашборды ссылаются на источник по нему, а не по имени.
  - name: Prometheus
    uid: system112-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      manageAlerts: true
      prometheusType: Prometheus
      timeInterval: 10s
