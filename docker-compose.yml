services:
  # ── Голосовой конвейер на CPU ─────────────────────────────────────────────
  # Поднимается обычным `docker compose up -d`, без профилей и без разовых
  # контейнеров-загрузчиков: модели ASR зашиты в образ, а llama-server берёт
  # GGUF из тома llm_models (при заданном LLM_MODEL_URL — скачивает на старте).
  #
  # Потоки рассчитаны на 6 ядер / 12 потоков (Ryzen 5 5600): распознавание,
  # модель и синтез работают по очереди в пределах хода, поэтому квоты cpus
  # не ставятся — квота ниже числа потоков только душит обработку промпта.
  #
  # Распознавание — Sherpa-ONNX (русский Zipformer int8), как на боевом сервере.
  asr:
    build:
      context: ./docker/asr
    image: system-112-asr-cpu:${ASR_IMAGE_TAG:-local}
    container_name: system-112-asr
    restart: unless-stopped
    init: true
    environment:
      SHERPA_PORT: "8787"
      # Потоки распознавания: на 6-ядерном сервере ровно по ядру на поток.
      SHERPA_THREADS: ${ASR_THREADS:-6}
      SHERPA_MODEL_DIR: /models/sherpa-onnx-zipformer-ru-int8-2025-04-20
      SHERPA_VAD_MODEL: /models/silero_vad.onnx
      # Адрес, который сервис сообщает браузеру для голосового сокета.
      WHISPER_PUBLIC_WS_URL: ${WHISPER_PUBLIC_WS_URL:-ws://127.0.0.1:8787}
    ports:
      - "127.0.0.1:${WHISPER_PORT:-8787}:8787"

  # Карта происшествий работает без интернета: TileServer отдаёт стили, шрифты
  # и векторные тайлы Москвы с областью из maps/. Наружу порт не публикуется —
  # клиент ходит через gateway по /maps/, иначе страница по HTTPS не может
  # загрузить тайлы по HTTP.
  tileserver:
    profiles: ["app", "maps"]
    image: ${MAP_TILESERVER_IMAGE:-maptiler/tileserver-gl:v5.6.0}
    container_name: system-112-training-tileserver
    restart: unless-stopped
    command:
      - "-c"
      - ${MAP_TILESERVER_CONFIG:-/data/config.json}
      - "--public_url"
      - ${MAP_TILESERVER_PUBLIC_URL:-/maps/}
    environment:
      TILESERVER_GL_ALLOWED_HOSTS: ${MAP_TILESERVER_ALLOWED_HOSTS:-*}
    volumes:
      - ./maps:/data:ro
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8080/styles/dark-matter/style.json').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Имена сервиса, образа и файла модели не привязаны к конкретной модели: она
  # меняется от итерации к итерации, а меняются только LLM_MODEL_FILE/URL.
  local-llm:
    image: ${LLM_SERVER_IMAGE:-ghcr.io/ggml-org/llama.cpp:server}
    container_name: system-112-local-llm
    restart: unless-stopped
    init: true
    environment:
      MODEL_FILE: /models/${LLM_MODEL_FILE:-caller.gguf}
      MODEL_URL: ${LLM_MODEL_URL:-}
      MODEL_EXTRA_ARGS: ${LLM_EXTRA_ARGS:-}
    # Модель качается, только если её ещё нет в томе. Флаг --model-url сам
    # llama-server не подходит: он сверяется с Hugging Face на каждом старте и
    # без сети не поднимается даже со скачанной моделью. Без LLM_MODEL_URL файл
    # кладут в том llm_models заранее.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        if [ ! -s "$$MODEL_FILE" ]; then
        if [ -z "$$MODEL_URL" ]; then echo "Нет $$MODEL_FILE в томе llm_models и не задан LLM_MODEL_URL" >&2; exit 1; fi;
        curl -fL --retry 10 --retry-all-errors --retry-delay 3 -sS -o "$$MODEL_FILE.part" "$$MODEL_URL" &&
        mv "$$MODEL_FILE.part" "$$MODEL_FILE" || exit 1;
        fi;
        exec /app/llama-server
        --model "$$MODEL_FILE"
        --alias training-model
        --host 0.0.0.0
        --port 8080
        --parallel ${LLM_PARALLEL:-2}
        --ctx-size 8192
        --threads ${LLM_THREADS:-12}
        --threads-batch ${LLM_THREADS_BATCH:-12}
        --batch-size 512
        --ubatch-size 512
        --flash-attn on
        --cache-type-k q8_0
        --cache-type-v q8_0
        --jinja
        --poll ${LLM_POLL:-0}
        $$MODEL_EXTRA_ARGS
        --metrics
    # i7-8700 single-request benchmark favored 12 SMT threads. This is only a
    # starting point: ASR uses two threads and the full pipeline must be profiled.
    ports:
      - "127.0.0.1:${LLM_PORT:-8080}:8080"
    volumes:
      # По умолчанию модели живут в томе. Для локального запуска достаточно
      # указать каталог в LLM_MODELS_DIR — тогда сюда примонтируется он, и
      # файлы не нужно перекладывать внутрь тома вручную.
      - ${LLM_MODELS_DIR:-llm_models}:/models
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      # Первый старт может качать модель из LLM_MODEL_URL.
      start_period: 30m

  # Структурные JSON-задачи нельзя отдавать дообученной модели заявителя.
  # Отдельный llama-server сохраняет CPU живого диалога и остаётся внутри контура.
  tools-llm:
    image: ${LLM_SERVER_IMAGE:-ghcr.io/ggml-org/llama.cpp:server}
    container_name: system-112-tools-llm
    restart: unless-stopped
    init: true
    environment:
      MODEL_FILE: /models/${TOOLS_LLM_MODEL_FILE:-hf/models--unsloth--gemma-4-E2B-it-qat-GGUF/snapshots/66a399f68ddd113b06dff02fca9523e55465d11d/gemma-4-E2B-it-qat-UD-Q4_K_XL.gguf}
      MODEL_URL: ${TOOLS_LLM_MODEL_URL:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        if [ ! -s "$$MODEL_FILE" ]; then
        if [ -z "$$MODEL_URL" ]; then echo "Нет $$MODEL_FILE в томе llm_models и не задан TOOLS_LLM_MODEL_URL" >&2; exit 1; fi;
        mkdir -p "$$(dirname "$$MODEL_FILE")";
        curl -fL --retry 10 --retry-all-errors --retry-delay 3 -sS -o "$$MODEL_FILE.part" "$$MODEL_URL" &&
        mv "$$MODEL_FILE.part" "$$MODEL_FILE" || exit 1;
        fi;
        exec /app/llama-server
        --model "$$MODEL_FILE"
        --alias ${TOOLS_LLM_MODEL:-tools-model}
        --host 0.0.0.0
        --port 8080
        --parallel 1
        --ctx-size 8192
        --threads ${TOOLS_LLM_THREADS:-4}
        --threads-batch ${TOOLS_LLM_THREADS_BATCH:-4}
        --batch-size 512
        --ubatch-size 512
        --flash-attn on
        --cache-type-k q8_0
        --cache-type-v q8_0
        --jinja
        --poll ${TOOLS_LLM_POLL:-1000}
        --metrics
    ports:
      - "127.0.0.1:${TOOLS_LLM_PORT:-8081}:8080"
    volumes:
      # По умолчанию модели живут в томе. Для локального запуска достаточно
      # указать каталог в LLM_MODELS_DIR — тогда сюда примонтируется он, и
      # файлы не нужно перекладывать внутрь тома вручную.
      - ${LLM_MODELS_DIR:-llm_models}:/models
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30m

  piper-tts:
    build:
      context: ./docker/piper-tts
    image: system-112-piper-tts:${PIPER_IMAGE_TAG:-local}
    container_name: system-112-piper-tts
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${PIPER_TTS_PORT:-5000}:5000"

  postgres:
    image: postgres:17-alpine
    container_name: system-112-training-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-system112}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-system112}
      POSTGRES_DB: ${POSTGRES_DB:-system112_training}
    ports:
      # Переопределяется через POSTGRES_PORT: на Windows дефолтный 54322 может
      # попасть в зарезервированный Hyper-V диапазон портов. Слушает только
      # localhost: backend в compose ходит в базу по имени сервиса, и на сервере
      # база не должна быть видна из интернета.
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-54322}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Первый backup выполняется при старте, последующие — раз в сутки. Образ
  # использует pg_dump той же major-версии, что и база. Артефакты должны
  # дополнительно копироваться с этого хоста во внешнее защищённое хранилище.
  postgres-backup:
    profiles: ["app", "ops"]
    build:
      context: .
      dockerfile: ops/postgres-backup/Dockerfile
    image: system-112-training-postgres-backup:${BACKUP_IMAGE_TAG:-local}
    container_name: system-112-training-postgres-backup
    restart: unless-stopped
    read_only: true
    init: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-system112}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-system112}
      POSTGRES_DB: ${POSTGRES_DB:-system112_training}
      BACKUP_DIRECTORY: /backups
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_MAX_AGE_SECONDS: ${BACKUP_MAX_AGE_SECONDS:-93600}
    volumes:
      - ${BACKUP_DIRECTORY:-./var/backups}:/backups
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "system112-backup", "status"]
      interval: 5m
      timeout: 30s
      retries: 3
      start_period: 2m

  # Объектное хранилище для записей разговоров. Нужен только при
  # CALL_RECORDING_ENABLED=true; без него звонок идёт как обычно.
  minio:
    image: quay.io/minio/minio:latest
    container_name: system-112-training-minio
    restart: unless-stopped
    init: true
    # MinIO не создаёт корзину сам. Её заводит тот же контейнер сразу после
    # старта сервера, чтобы в стеке не оставался завершившийся помощник.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        minio server /data --console-address ":9001" &
        pid=$$!;
        trap 'kill -TERM $$pid' TERM INT;
        until mc ready local >/dev/null 2>&1; do sleep 1; done;
        mc alias set boot http://127.0.0.1:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null &&
        mc mb --ignore-existing "boot/$$CALL_RECORDING_S3_BUCKET";
        wait $$pid
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-system112}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-system112secret}
      CALL_RECORDING_S3_BUCKET: ${CALL_RECORDING_S3_BUCKET:-call-recordings}
    ports:
      # Записи отдаёт клиенту сам backend, поэтому хранилище наружу не нужно.
      - "${MINIO_BIND_ADDRESS:-127.0.0.1}:${MINIO_PORT:-9000}:9000"
      - "${MINIO_BIND_ADDRESS:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  pgadmin:
    image: dpage/pgadmin4:8.14
    container_name: pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    ports:
      - "${PGADMIN_BIND_ADDRESS:-127.0.0.1}:${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

  # Сбор технических метрик backend и ASR. Какой backend читать, решает
  # PROMETHEUS_CONFIG: prometheus.yml — контейнер из профиля app (сервер),
  # prometheus.host.yml — backend, запущенный на хосте через bun run start:dev.
  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: system-112-training-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "${PROMETHEUS_BIND_ADDRESS:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./observability/${PROMETHEUS_CONFIG:-prometheus.yml}:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - host.docker.internal:host-gateway

  # Дашборды поверх Prometheus. Источник данных и дашборд backend заводятся из
  # файлов при старте, руками в интерфейсе ничего настраивать не нужно. Порт
  # 3001, а не 3000: 3000 занят API.
  grafana:
    image: grafana/grafana-oss:12.4.3
    container_name: system-112-training-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "${GRAFANA_BIND_ADDRESS:-127.0.0.1}:${GRAFANA_PORT:-3001}:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  # Учебная IP-АТС: рабочие места ДДС звонят нарядам по SIP, а на том конце
  # отвечает backend через ARI. SIP и RTP публикуются в сеть класса — к ним
  # подключаются аппаратные телефоны вроде РТУ Т16Р или софтфоны; ARI остаётся
  # внутри сети compose.
  asterisk:
    image: ${ASTERISK_IMAGE:-andrius/asterisk:22}
    container_name: system-112-training-asterisk
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/docker-entrypoint.sh"]
    environment:
      ASTERISK_ARI_USER: ${ASTERISK_ARI_USER:-system112}
      # Пустые пароли не пропустит entrypoint: `:?` здесь сломал бы compose
      # тем, кто телефонию не поднимает.
      ASTERISK_ARI_PASSWORD: ${ASTERISK_ARI_PASSWORD:-}
      ASTERISK_ARI_APP: ${ASTERISK_ARI_APP:-crew-handoff}
      ASTERISK_SIP_PASSWORD: ${ASTERISK_SIP_PASSWORD:-}
      ASTERISK_WORKSTATIONS: ${ASTERISK_WORKSTATIONS:-201,202,203,204}
      ASTERISK_WEBRTC_WORKSTATIONS: ${ASTERISK_WEBRTC_WORKSTATIONS:-}
      ASTERISK_EXTERNAL_ADDRESS: ${ASTERISK_EXTERNAL_ADDRESS:-}
      ASTERISK_RTP_START: "10000"
      ASTERISK_RTP_END: "10099"
    ports:
      - "${ASTERISK_SIP_BIND_ADDRESS:-0.0.0.0}:5060:5060/udp"
      - "${ASTERISK_SIP_BIND_ADDRESS:-0.0.0.0}:5060:5060/tcp"
      - "${ASTERISK_SIP_BIND_ADDRESS:-0.0.0.0}:10000-10099:10000-10099/udp"
      # ARI без TLS: только на localhost — для backend, запущенного на хосте.
      - "127.0.0.1:${ASTERISK_ARI_PORT:-8088}:8088"
    volumes:
      - ./telephony/asterisk:/etc/asterisk-templates:ro
      - ./telephony/asterisk/docker-entrypoint.sh:/docker-entrypoint.sh:ro
      # Реплики нарядов пишет backend, играет Asterisk. Каталог на хосте, а
      # не том compose: его видит и backend, запущенный вне контейнера.
      - ./telephony-sounds/crew:/var/lib/asterisk/sounds/crew

  # ── Приложение ─────────────────────────────────────────────────────────────
  # Миграции backend применяет сам при старте (drizzle/migrate.ts). Сид
  # сценариев и учётной записи выполняет образ tools — см. docs/deployment.md.
  backend:
    build:
      context: .
      target: runtime
    image: system-112-training-backend:${BACKEND_IMAGE_TAG:-local}
    container_name: system-112-training-backend
    restart: unless-stopped
    init: true
    env_file: .env
    # Адреса внутри стека задаёт compose, а не .env: в .env разработчика база и
    # хранилище живут на localhost, а внутри контейнера localhost — он сам.
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      TRUST_PROXY_HOPS: "1"
      METRICS_ENABLED: "true"
      METRICS_HOST: 0.0.0.0
      METRICS_PORT: "9464"
      DATABASE_URL: postgresql://${POSTGRES_USER:-system112}:${POSTGRES_PASSWORD:-system112}@postgres:5432/${POSTGRES_DB:-system112_training}
      CALL_RECORDING_S3_ENDPOINT: http://minio:9000
      CALL_RECORDING_S3_ACCESS_KEY_ID: ${CALL_RECORDING_S3_ACCESS_KEY_ID:-${MINIO_ROOT_USER:-system112}}
      CALL_RECORDING_S3_SECRET_ACCESS_KEY: ${CALL_RECORDING_S3_SECRET_ACCESS_KEY:-${MINIO_ROOT_PASSWORD:-system112secret}}
      ASR_SERVICE_URL: http://asr:8787
      LLM_BASE_URL: http://local-llm:8080/v1
      LLM_MODEL: training-model
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-30000}
      LLM_CONCURRENCY: ${LLM_CONCURRENCY:-1}
      TOOLS_LLM_BASE_URL: http://tools-llm:8080/v1
      TOOLS_LLM_MODEL: ${TOOLS_LLM_MODEL:-tools-model}
      TOOLS_LLM_TIMEOUT_MS: ${TOOLS_LLM_TIMEOUT_MS:-120000}
      TOOLS_LLM_CONCURRENCY: ${TOOLS_LLM_CONCURRENCY:-1}
      LLM_INTENT_TIMEOUT_MS: ${LLM_INTENT_TIMEOUT_MS:-2500}
      LLM_REPLY_MAX_TOKENS: ${LLM_REPLY_MAX_TOKENS:-256}
      LLM_REPLY_TEMPERATURE: ${LLM_REPLY_TEMPERATURE:-0.3}
      LLM_REPLY_THINKING: ${LLM_REPLY_THINKING:-false}
      PIPER_TTS_BASE_URL: http://piper-tts:5000
      PIPER_TTS_MALE_VOICE: ${PIPER_TTS_MALE_VOICE:-ru_RU-dmitri-medium}
      PIPER_TTS_FEMALE_VOICE: ${PIPER_TTS_FEMALE_VOICE:-ru_RU-irina-medium}
      # Backend подключается к уже запущенному Asterisk, только когда телефония
      # явно включена; без неё рабочее место ДДС работает без передачи наряду.
      TELEPHONY_ENABLED: ${TELEPHONY_ENABLED:-false}
      ASTERISK_ARI_URL: http://asterisk:8088
      ASTERISK_ARI_USER: ${ASTERISK_ARI_USER:-system112}
      ASTERISK_ARI_PASSWORD: ${ASTERISK_ARI_PASSWORD:-}
      ASTERISK_ARI_APP: ${ASTERISK_ARI_APP:-crew-handoff}
      # Asterisk передаёт RTP по внутренней compose-сети напрямую backend.
      ASTERISK_MEDIA_HOST: backend
      ASTERISK_MEDIA_BIND_HOST: 0.0.0.0
      ASTERISK_SIP_PASSWORD: ${ASTERISK_SIP_PASSWORD:-}
      ASTERISK_WEBRTC_WORKSTATIONS: ${ASTERISK_WEBRTC_WORKSTATIONS:-}
      ASTERISK_WEBRTC_WS_URL: ${ASTERISK_WEBRTC_WS_URL:-ws://127.0.0.1:8088/ws}
      ASTERISK_WEBRTC_SIP_DOMAIN: ${ASTERISK_WEBRTC_SIP_DOMAIN:-localhost}
      TELEPHONY_SOUNDS_DIR: /app/telephony-sounds
    # HTTP backend и метрики доступны только сервисам сети Compose.
    # Единственная host-публикация production API — TLS-gateway ниже.
    expose:
      - "3000"
      - "9464"
    volumes:
      - backend_logs:/app/logs
      - ./telephony-sounds/crew:/app/telephony-sounds/crew
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      asr:
        condition: service_healthy
      piper-tts:
        condition: service_healthy
      local-llm:
        condition: service_healthy
      tools-llm:
        condition: service_healthy

  # Единственная точка входа production-контура. Сертификат выдаёт внутренняя
  # CA организации; self-signed helper ниже предназначен только для dev/stage.
  gateway:
    profiles: ["app"]
    build:
      context: ./docker/gateway
      additional_contexts:
        # Веб-клиент хранится в монорепозитории и собирается внутри образа.
        web-src: ./web
    image: system-112-gateway:${GATEWAY_IMAGE_TAG:-local}
    container_name: system-112-training-gateway
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    command: ["nginx", "-g", "daemon off;"]
    ports:
      - "${TLS_BIND_ADDRESS:-0.0.0.0}:${TLS_PORT:-443}:8443"
    volumes:
      - ./ops/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${TLS_CERTIFICATE_PATH:-./ops/tls/certs/tls.crt}:/etc/nginx/tls/tls.crt:ro
      - ${TLS_PRIVATE_KEY_PATH:-./ops/tls/certs/tls.key}:/etc/nginx/tls/tls.key:ro
    tmpfs:
      - /tmp
      - /var/cache/nginx
    depends_on:
      backend:
        condition: service_healthy
      asterisk:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --no-check-certificate
        - --output-document=-
        - https://127.0.0.1:8443/gateway-health
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  llm_models:
  postgres_data:
  pgadmin-data:
  minio_data:
  prometheus_data:
  grafana_data:
  backend_logs:
