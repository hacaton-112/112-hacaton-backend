services:
  # Серверный Qwen3-TTS runtime. Профиль не включается обычным `compose up`,
  # потому что требует Linux, NVIDIA Container Toolkit и доступную CUDA GPU.
  qwen-tts:
    profiles: ["tts-cuda"]
    image: ${QWEN_TTS_CUDA_IMAGE:-vllm/vllm-omni:v0.28.0}
    container_name: system-112-training-qwen-tts
    restart: unless-stopped
    init: true
    ipc: host
    command:
      - vllm
      - serve
      - ${QWEN_TTS_CUDA_MODEL:-Qwen/Qwen3-TTS-12Hz-1.7B-Base}
      - --deploy-config
      - /app/vllm-omni/vllm_omni/deploy/qwen3_tts.yaml
      - --omni
      - --host
      - 0.0.0.0
      - --port
      - "8091"
      - --trust-remote-code
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    ports:
      # Speech API не имеет прикладной авторизации: наружу его по умолчанию
      # не публикуем. Для отдельного GPU-хоста задайте адрес приватной сети.
      - "${QWEN_TTS_CUDA_BIND_ADDRESS:-127.0.0.1}:${QWEN_TTS_CUDA_PORT:-8091}:8091"
    volumes:
      - qwen_tts_hf_cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/health', timeout=5)
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 20m
    stop_grace_period: 2m

  postgres:
    image: postgres:17-alpine
    container_name: system-112-training-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-system112}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-system112}
      POSTGRES_DB: ${POSTGRES_DB:-system112_training}
    ports:
      # Переопределяется через POSTGRES_PORT: на Windows дефолтный 54322 может
      # попасть в зарезервированный Hyper-V диапазон портов.
      - "${POSTGRES_PORT:-54322}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Объектное хранилище для записей разговоров. Нужен только при
  # CALL_RECORDING_ENABLED=true; без него звонок идёт как обычно.
  minio:
    image: minio/minio:latest
    container_name: system-112-training-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-system112}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-system112secret}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # MinIO не создаёт корзину сам, а запись не должна падать на первом же
  # звонке: контейнер отрабатывает один раз и выходит.
  minio-bucket:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-system112}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-system112secret}
      CALL_RECORDING_S3_BUCKET: ${CALL_RECORDING_S3_BUCKET:-call-recordings}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/$${CALL_RECORDING_S3_BUCKET}
      "
  pgadmin:
    image: dpage/pgadmin4:8.14
    container_name: pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    ports:
      - '${PGADMIN_PORT:-5050}:80'
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  qwen_tts_hf_cache:
  postgres_data:
  pgadmin-data:
  minio_data:
