services:
  # Серверный Qwen3-TTS runtime. Профиль не включается обычным `compose up`,
  # потому что требует Linux, NVIDIA Container Toolkit и доступную CUDA GPU.
  qwen-tts:
    profiles: ["tts-cuda"]
    image: ${QWEN_TTS_CUDA_IMAGE:-vllm/vllm-omni:v0.28.0}
    container_name: system-112-training-qwen-tts
    restart: unless-stopped
    init: true
    ipc: host
    command:
      - vllm
      - serve
      - ${QWEN_TTS_CUDA_MODEL:-Qwen/Qwen3-TTS-12Hz-1.7B-Base}
      - --deploy-config
      - /app/vllm-omni/vllm_omni/deploy/qwen3_tts.yaml
      - --omni
      - --host
      - 0.0.0.0
      - --port
      - "8091"
      - --trust-remote-code
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    ports:
      # Speech API не имеет прикладной авторизации: наружу его по умолчанию
      # не публикуем. Для отдельного GPU-хоста задайте адрес приватной сети.
      - "${QWEN_TTS_CUDA_BIND_ADDRESS:-127.0.0.1}:${QWEN_TTS_CUDA_PORT:-8091}:8091"
    volumes:
      - qwen_tts_hf_cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/health', timeout=5)
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 20m
    stop_grace_period: 2m

  postgres:
    image: postgres:17-alpine
    container_name: system-112-training-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-system112}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-system112}
      POSTGRES_DB: ${POSTGRES_DB:-system112_training}
    ports:
      # Переопределяется через POSTGRES_PORT: на Windows дефолтный 54322 может
      # попасть в зарезервированный Hyper-V диапазон портов. Слушает только
      # localhost: backend в compose ходит в базу по имени сервиса, и на сервере
      # база не должна быть видна из интернета.
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-54322}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Первый backup выполняется при старте, последующие — раз в сутки. Образ
  # использует pg_dump той же major-версии, что и база. Артефакты должны
  # дополнительно копироваться с этого хоста во внешнее защищённое хранилище.
  postgres-backup:
    profiles: ["app", "ops"]
    build:
      context: .
      dockerfile: ops/postgres-backup/Dockerfile
    image: system-112-training-postgres-backup:${BACKUP_IMAGE_TAG:-local}
    container_name: system-112-training-postgres-backup
    restart: unless-stopped
    read_only: true
    init: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-system112}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-system112}
      POSTGRES_DB: ${POSTGRES_DB:-system112_training}
      BACKUP_DIRECTORY: /backups
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_MAX_AGE_SECONDS: ${BACKUP_MAX_AGE_SECONDS:-93600}
    volumes:
      - ${BACKUP_DIRECTORY:-./var/backups}:/backups
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "system112-backup", "status"]
      interval: 5m
      timeout: 30s
      retries: 3
      start_period: 2m

  # Объектное хранилище для записей разговоров. Нужен только при
  # CALL_RECORDING_ENABLED=true; без него звонок идёт как обычно.
  minio:
    image: minio/minio:latest
    container_name: system-112-training-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-system112}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-system112secret}
    ports:
      # Записи отдаёт клиенту сам backend, поэтому хранилище наружу не нужно.
      - "${MINIO_BIND_ADDRESS:-127.0.0.1}:${MINIO_PORT:-9000}:9000"
      - "${MINIO_BIND_ADDRESS:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # MinIO не создаёт корзину сам, а запись не должна падать на первом же
  # звонке: контейнер отрабатывает один раз и выходит.
  minio-bucket:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-system112}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-system112secret}
      CALL_RECORDING_S3_BUCKET: ${CALL_RECORDING_S3_BUCKET:-call-recordings}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/$${CALL_RECORDING_S3_BUCKET}
      "
  pgadmin:
    image: dpage/pgadmin4:8.14
    container_name: pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    ports:
      - "${PGADMIN_BIND_ADDRESS:-127.0.0.1}:${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

  # Сбор технических метрик backend и ASR. Какой backend читать, решает
  # PROMETHEUS_CONFIG: prometheus.yml — контейнер из профиля app (сервер),
  # prometheus.host.yml — backend, запущенный на хосте через bun run start:dev.
  prometheus:
    image: prom/prometheus:latest
    container_name: system-112-training-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "${PROMETHEUS_BIND_ADDRESS:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./observability/${PROMETHEUS_CONFIG:-prometheus.yml}:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - host.docker.internal:host-gateway

  # Дашборды поверх Prometheus. Источник данных и дашборд backend заводятся из
  # файлов при старте, руками в интерфейсе ничего настраивать не нужно. Порт
  # 3001, а не 3000: 3000 занят API.
  grafana:
    image: grafana/grafana-oss:12.4.3
    container_name: system-112-training-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "${GRAFANA_BIND_ADDRESS:-127.0.0.1}:${GRAFANA_PORT:-3001}:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  # ── Приложение ─────────────────────────────────────────────────────────────
  # Профиль app не включается обычным `compose up`: разработчик запускает
  # backend на хосте, а в Docker держит только базу, хранилище и мониторинг.
  # На сервере стек поднимается целиком: docker compose --profile app up -d.

  # Разовая задача: применяет миграции и выходит. backend ждёт её успешного
  # завершения, поэтому схема базы всегда совпадает с кодом образа. Тот же
  # образ выполняет сид сценариев и создание учётной записи — см.
  # docs/deployment.md.
  migrate:
    profiles: ["app"]
    build:
      context: .
      target: tools
    image: system-112-training-backend-tools:${BACKEND_IMAGE_TAG:-local}
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-system112}:${POSTGRES_PASSWORD:-system112}@postgres:5432/${POSTGRES_DB:-system112_training}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    profiles: ["app"]
    build:
      context: .
      target: runtime
    image: system-112-training-backend:${BACKEND_IMAGE_TAG:-local}
    container_name: system-112-training-backend
    restart: unless-stopped
    init: true
    env_file: .env
    # Адреса внутри стека задаёт compose, а не .env: в .env разработчика база и
    # хранилище живут на localhost, а внутри контейнера localhost — он сам.
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      TRUST_PROXY_HOPS: "1"
      METRICS_ENABLED: "true"
      METRICS_HOST: 0.0.0.0
      METRICS_PORT: "9464"
      DATABASE_URL: postgresql://${POSTGRES_USER:-system112}:${POSTGRES_PASSWORD:-system112}@postgres:5432/${POSTGRES_DB:-system112_training}
      CALL_RECORDING_S3_ENDPOINT: http://minio:9000
      CALL_RECORDING_S3_ACCESS_KEY_ID: ${CALL_RECORDING_S3_ACCESS_KEY_ID:-${MINIO_ROOT_USER:-system112}}
      CALL_RECORDING_S3_SECRET_ACCESS_KEY: ${CALL_RECORDING_S3_SECRET_ACCESS_KEY:-${MINIO_ROOT_PASSWORD:-system112secret}}
    # HTTP backend и метрики доступны только сервисам сети Compose. Единственная
    # host-публикация production API находится на TLS gateway ниже.
    expose:
      - "3000"
      - "9464"
    volumes:
      - backend_logs:/app/logs
    # ASR и TTS обычно подняты на том же хосте из репозитория infra и доступны
    # контейнеру как host.docker.internal.
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Единственная точка входа production-контура. Сертификат выдаёт внутренняя
  # CA организации; self-signed helper ниже предназначен только для dev/stage.
  gateway:
    profiles: ["app"]
    image: nginx:1.28-alpine
    container_name: system-112-training-gateway
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    command: ["nginx", "-g", "daemon off;"]
    ports:
      - "${TLS_BIND_ADDRESS:-0.0.0.0}:${TLS_PORT:-443}:8443"
    volumes:
      - ./ops/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${TLS_CERTIFICATE_PATH:-./ops/tls/certs/tls.crt}:/etc/nginx/tls/tls.crt:ro
      - ${TLS_PRIVATE_KEY_PATH:-./ops/tls/certs/tls.key}:/etc/nginx/tls/tls.key:ro
    tmpfs:
      - /tmp
      - /var/cache/nginx
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --no-check-certificate
        - --output-document=-
        - https://127.0.0.1:8443/gateway-health
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  qwen_tts_hf_cache:
  postgres_data:
  pgadmin-data:
  minio_data:
  prometheus_data:
  grafana_data:
  backend_logs:
