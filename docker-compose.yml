services:
  # Серверный Qwen3-TTS runtime. Профиль не включается обычным `compose up`,
  # потому что требует Linux, NVIDIA Container Toolkit и доступную CUDA GPU.
  qwen-tts:
    profiles: ["tts-cuda"]
    image: ${QWEN_TTS_CUDA_IMAGE:-vllm/vllm-omni:v0.28.0}
    container_name: system-112-training-qwen-tts
    restart: unless-stopped
    init: true
    ipc: host
    command:
      - vllm
      - serve
      - ${QWEN_TTS_CUDA_MODEL:-Qwen/Qwen3-TTS-12Hz-1.7B-Base}
      - --deploy-config
      - /app/vllm-omni/vllm_omni/deploy/qwen3_tts.yaml
      - --omni
      - --host
      - 0.0.0.0
      - --port
      - "8091"
      - --trust-remote-code
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    ports:
      # Speech API не имеет прикладной авторизации: наружу его по умолчанию
      # не публикуем. Для отдельного GPU-хоста задайте адрес приватной сети.
      - "${QWEN_TTS_CUDA_BIND_ADDRESS:-127.0.0.1}:${QWEN_TTS_CUDA_PORT:-8091}:8091"
    volumes:
      - qwen_tts_hf_cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/health', timeout=5)
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 20m
    stop_grace_period: 2m

  # ── Голосовой конвейер на CPU ─────────────────────────────────────────────
  # Поднимается обычным `docker compose up -d`, без профилей и без разовых
  # контейнеров-загрузчиков: модели ASR зашиты в образ, patched bitnet.cpp /
  # llama-server скачивает выбранный GGUF при первом старте в том llm_models.
  #
  # Потоки рассчитаны на 6 ядер / 12 потоков (Ryzen 5 5600): распознавание,
  # модель и синтез работают по очереди в пределах хода, поэтому квоты cpus
  # не ставятся — квота ниже числа потоков только душит обработку промпта.
  asr:
    build:
      context: ./docker/asr
      additional_contexts:
        # Исходники сервиса распознавания — соседний репозиторий.
        asr-src: ${ASR_SOURCE_DIR:-../asr-service}
    image: system-112-asr-cpu:${ASR_IMAGE_TAG:-local}
    container_name: system-112-asr
    restart: unless-stopped
    init: true
    environment:
      WHISPER_HOST: 0.0.0.0
      WHISPER_PORT: "8787"
      WHISPER_DEVICE: cpu
      WHISPER_THREADS: ${WHISPER_THREADS:-2}
      WHISPER_PARTIALS_ENABLED: "false"
      WHISPER_PUBLIC_WS_URL: ${WHISPER_PUBLIC_WS_URL:-ws://127.0.0.1:8787}
      WHISPER_PARTIAL_INTERVAL_MS: ${WHISPER_PARTIAL_INTERVAL_MS:-2000}
      WHISPER_SILENCE_TIMEOUT_MS: ${WHISPER_SILENCE_TIMEOUT_MS:-300}
      RUST_LOG: ${ASR_RUST_LOG:-asr_service=info,tower_http=warn,whisper_rs=warn}
    ports:
      - "127.0.0.1:${WHISPER_PORT:-8787}:8787"

  local-llm:
    build:
      context: ./docker/bitnet
      args:
        BITNET_COMMIT: ${BITNET_COMMIT:-0b341e582afbf9e1011f24744b554c96a3477eb5}
    image: system-112-bitnet-cpu:${BITNET_IMAGE_TAG:-local}
    container_name: system-112-local-llm
    restart: unless-stopped
    init: true
    environment:
      MODEL_FILE: /models/${LOCAL_LLM_MODEL_FILE:-Qwen3-0.6B-Q4_K_M.gguf}
      MODEL_URL: ${LOCAL_LLM_MODEL_URL:-https://huggingface.co/unsloth/Qwen3-0.6B-GGUF/resolve/main/Qwen3-0.6B-Q4_K_M.gguf}
      MODEL_EXTRA_ARGS: ${LOCAL_LLM_EXTRA_ARGS:-}
    # Модель качается, только если её ещё нет в томе. Флаг --model-url сам
    # llama-server не подходит: он сверяется с Hugging Face на каждом старте и
    # без сети не поднимается даже со скачанной моделью.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        if [ ! -s "$$MODEL_FILE" ]; then
        curl -fL --retry 10 --retry-all-errors --retry-delay 3 -sS -o "$$MODEL_FILE.part" "$$MODEL_URL" &&
        mv "$$MODEL_FILE.part" "$$MODEL_FILE" || exit 1;
        fi;
        exec /app/llama-server
        --model "$$MODEL_FILE"
        --alias training-model
        --host 0.0.0.0
        --port 8080
        --parallel ${LOCAL_LLM_PARALLEL:-2}
        --ctx-size 8192
        --threads ${LOCAL_LLM_THREADS:-12}
        --threads-batch ${LOCAL_LLM_THREADS_BATCH:-12}
        --batch-size 512
        --ubatch-size 512
        --flash-attn on
        --cache-type-k q8_0
        --cache-type-v q8_0
        --jinja
        --poll ${LOCAL_LLM_POLL:-0}
        --mmap
        --mlock
        $$MODEL_EXTRA_ARGS
        --metrics
    # i7-8700 single-request benchmark favored 12 SMT threads. This is only a
    # starting point: ASR uses two threads and the full pipeline must be profiled.
    ports:
      - "127.0.0.1:${LOCAL_LLM_PORT:-8080}:8080"
    volumes:
      - llm_models:/models
    cap_add:
      - IPC_LOCK
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      # Первый старт качает модель (~379 МиБ для профиля по умолчанию).
      start_period: 30m

  piper-tts:
    build:
      context: ./docker/piper-tts
    image: system-112-piper-tts:${PIPER_IMAGE_TAG:-local}
    container_name: system-112-piper-tts
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${PIPER_TTS_PORT:-5000}:5000"

  postgres:
    image: postgres:17-alpine
    container_name: system-112-training-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-system112}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-system112}
      POSTGRES_DB: ${POSTGRES_DB:-system112_training}
    ports:
      # Переопределяется через POSTGRES_PORT: на Windows дефолтный 54322 может
      # попасть в зарезервированный Hyper-V диапазон портов. Слушает только
      # localhost: backend в compose ходит в базу по имени сервиса, и на сервере
      # база не должна быть видна из интернета.
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-54322}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Объектное хранилище для записей разговоров. Нужен только при
  # CALL_RECORDING_ENABLED=true; без него звонок идёт как обычно.
  minio:
    image: quay.io/minio/minio:latest
    container_name: system-112-training-minio
    restart: unless-stopped
    init: true
    # MinIO не создаёт корзину сам. Её заводит тот же контейнер сразу после
    # старта сервера, чтобы в стеке не оставался завершившийся помощник.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        minio server /data --console-address ":9001" &
        pid=$$!;
        trap 'kill -TERM $$pid' TERM INT;
        until mc ready local >/dev/null 2>&1; do sleep 1; done;
        mc alias set boot http://127.0.0.1:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null &&
        mc mb --ignore-existing "boot/$$CALL_RECORDING_S3_BUCKET";
        wait $$pid
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-system112}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-system112secret}
      CALL_RECORDING_S3_BUCKET: ${CALL_RECORDING_S3_BUCKET:-call-recordings}
    ports:
      # Записи отдаёт клиенту сам backend, поэтому хранилище наружу не нужно.
      - "${MINIO_BIND_ADDRESS:-127.0.0.1}:${MINIO_PORT:-9000}:9000"
      - "${MINIO_BIND_ADDRESS:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  pgadmin:
    image: dpage/pgadmin4:8.14
    container_name: pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    ports:
      - '${PGADMIN_BIND_ADDRESS:-127.0.0.1}:${PGADMIN_PORT:-5050}:80'
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

  # Сбор технических метрик backend и ASR. Какой backend читать, решает
  # PROMETHEUS_CONFIG: prometheus.yml — контейнер из профиля app (сервер),
  # prometheus.host.yml — backend, запущенный на хосте через bun run start:dev.
  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: system-112-training-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "${PROMETHEUS_BIND_ADDRESS:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./observability/${PROMETHEUS_CONFIG:-prometheus.yml}:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - host.docker.internal:host-gateway

  # Дашборды поверх Prometheus. Источник данных и дашборд backend заводятся из
  # файлов при старте, руками в интерфейсе ничего настраивать не нужно. Порт
  # 3001, а не 3000: 3000 занят API.
  grafana:
    image: grafana/grafana-oss:12.4.3
    container_name: system-112-training-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "${GRAFANA_BIND_ADDRESS:-127.0.0.1}:${GRAFANA_PORT:-3001}:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  # Учебная IP-АТС: рабочие места ДДС звонят нарядам по SIP, а на том конце
  # отвечает backend через ARI. SIP и RTP публикуются в сеть класса — к ним
  # подключаются аппаратные телефоны вроде РТУ Т16Р или софтфоны; ARI остаётся
  # внутри сети compose.
  asterisk:
    image: ${ASTERISK_IMAGE:-andrius/asterisk:22}
    container_name: system-112-training-asterisk
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/docker-entrypoint.sh"]
    environment:
      ASTERISK_ARI_USER: ${ASTERISK_ARI_USER:-system112}
      # Пустые пароли не пропустит entrypoint: `:?` здесь сломал бы compose
      # тем, кто телефонию не поднимает.
      ASTERISK_ARI_PASSWORD: ${ASTERISK_ARI_PASSWORD:-}
      ASTERISK_ARI_APP: ${ASTERISK_ARI_APP:-crew-handoff}
      ASTERISK_SIP_PASSWORD: ${ASTERISK_SIP_PASSWORD:-}
      ASTERISK_WORKSTATIONS: ${ASTERISK_WORKSTATIONS:-201,202,203,204}
      ASTERISK_EXTERNAL_ADDRESS: ${ASTERISK_EXTERNAL_ADDRESS:-}
      ASTERISK_RTP_START: "10000"
      ASTERISK_RTP_END: "10099"
    ports:
      - "${ASTERISK_SIP_BIND_ADDRESS:-0.0.0.0}:5060:5060/udp"
      - "${ASTERISK_SIP_BIND_ADDRESS:-0.0.0.0}:5060:5060/tcp"
      - "${ASTERISK_SIP_BIND_ADDRESS:-0.0.0.0}:10000-10099:10000-10099/udp"
      # ARI без TLS: только на localhost — для backend, запущенного на хосте.
      - "127.0.0.1:${ASTERISK_ARI_PORT:-8088}:8088"
    volumes:
      - ./telephony/asterisk:/etc/asterisk-templates:ro
      - ./telephony/asterisk/docker-entrypoint.sh:/docker-entrypoint.sh:ro
      # Реплики нарядов пишет backend, играет Asterisk. Каталог на хосте, а
      # не том compose: его видит и backend, запущенный вне контейнера.
      - ./telephony-sounds/crew:/var/lib/asterisk/sounds/crew

  # ── Приложение ─────────────────────────────────────────────────────────────
  # Миграции backend применяет сам при старте (drizzle/migrate.ts). Сид
  # сценариев и учётной записи выполняет образ tools — см. docs/deployment.md.
  backend:
    build:
      context: .
      target: runtime
    image: system-112-training-backend:${BACKEND_IMAGE_TAG:-local}
    container_name: system-112-training-backend
    restart: unless-stopped
    init: true
    env_file: .env
    # Адреса внутри стека задаёт compose, а не .env: в .env разработчика база и
    # хранилище живут на localhost, а внутри контейнера localhost — он сам.
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      METRICS_ENABLED: "true"
      METRICS_HOST: 0.0.0.0
      METRICS_PORT: "9464"
      DATABASE_URL: postgresql://${POSTGRES_USER:-system112}:${POSTGRES_PASSWORD:-system112}@postgres:5432/${POSTGRES_DB:-system112_training}
      CALL_RECORDING_S3_ENDPOINT: http://minio:9000
      CALL_RECORDING_S3_ACCESS_KEY_ID: ${CALL_RECORDING_S3_ACCESS_KEY_ID:-${MINIO_ROOT_USER:-system112}}
      CALL_RECORDING_S3_SECRET_ACCESS_KEY: ${CALL_RECORDING_S3_SECRET_ACCESS_KEY:-${MINIO_ROOT_PASSWORD:-system112secret}}
      ASR_SERVICE_URL: http://asr:8787
      LLM_PROVIDER: local
      LOCAL_LLM_BASE_URL: http://local-llm:8080/v1
      LOCAL_LLM_MODEL: training-model
      LOCAL_LLM_TIMEOUT_MS: ${LOCAL_LLM_TIMEOUT_MS:-30000}
      LOCAL_LLM_CONCURRENCY: ${LOCAL_LLM_CONCURRENCY:-1}
      LOCAL_LLM_INTENT_TIMEOUT_MS: ${LOCAL_LLM_INTENT_TIMEOUT_MS:-2500}
      LOCAL_LLM_REPLY_MAX_TOKENS: ${LOCAL_LLM_REPLY_MAX_TOKENS:-128}
      QWEN_TTS_PROVIDER: piper
      PIPER_TTS_BASE_URL: http://piper-tts:5000
      PIPER_TTS_MALE_VOICE: ${PIPER_TTS_MALE_VOICE:-ru_RU-dmitri-medium}
      PIPER_TTS_FEMALE_VOICE: ${PIPER_TTS_FEMALE_VOICE:-ru_RU-irina-medium}
      # Backend подключается к уже запущенному Asterisk, только когда телефония
      # явно включена; без неё рабочее место ДДС работает без передачи наряду.
      TELEPHONY_ENABLED: ${TELEPHONY_ENABLED:-false}
      ASTERISK_ARI_URL: http://asterisk:8088
      ASTERISK_ARI_USER: ${ASTERISK_ARI_USER:-system112}
      ASTERISK_ARI_PASSWORD: ${ASTERISK_ARI_PASSWORD:-}
      ASTERISK_ARI_APP: ${ASTERISK_ARI_APP:-crew-handoff}
      TELEPHONY_SOUNDS_DIR: /app/telephony-sounds
    ports:
      # API и WebSocket голосового канала — единственный вход, который нужен
      # приложению. За обратным прокси с TLS задайте BACKEND_BIND_ADDRESS=127.0.0.1.
      - "${BACKEND_BIND_ADDRESS:-0.0.0.0}:${BACKEND_PORT:-3000}:3000"
    # Метрики без авторизации наружу не публикуются: Prometheus читает их из
    # сети compose.
    expose:
      - "9464"
    volumes:
      - backend_logs:/app/logs
      - ./telephony-sounds/crew:/app/telephony-sounds/crew
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      asr:
        condition: service_healthy
      piper-tts:
        condition: service_healthy
      local-llm:
        condition: service_healthy

volumes:
  qwen_tts_hf_cache:
  llm_models:
  postgres_data:
  pgadmin-data:
  minio_data:
  prometheus_data:
  grafana_data:
  backend_logs:
